name: auto-cache-pool-tarball

# 该 workflow 负责生成/刷新依赖源码池（pool + all-deps.zip）：
#   - schedule       : 每 6 天定时刷新，保持 pool 缓存热度
#   - workflow_dispatch : 手动触发
#   - push tags 'v*' : 发版时重建 pool 并产出 Release / 云对象存储资产
# 普通 push / pull_request 不再触发：各构建 workflow 自身会在需要时补齐 pool。
on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 0 */6 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  auto-cache-pool:
    if: ${{ (github.repository_owner == 'swoole') && (!contains(github.event.head_commit.message, '--filter=') || contains(github.event.head_commit.message, '[auto-cache-pool]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Source Code
        run: |
          echo $PATH
          env
          docker info
          id -u
          id -g
          who
          cat /etc/os-release
          hostnamectl
          uname -s
          uname -m
          uname -r

          cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c
          cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l
          cat /proc/cpuinfo | grep "cpu cores" | uniq
          cat /proc/cpuinfo| grep "processor"| wc -l
          lscpu

          export IPV6=$(ip -6 address show  | grep inet6 | awk '{print $2}' | cut -d'/' -f1 | sed -n '2p')
          export IPV4=$(ip -4 address show  | grep inet | grep -v 127.0.0 | awk '{print $2}' | cut -d'/' -f1 | sed -n '1p')
          echo $IPV4
          echo $IPV6
          echo "X_IPV6=${IPV6}" >> $GITHUB_ENV
          echo "X_IPV4=${IPV4}" >> $GITHUB_ENV

      - name: Cache PHP Runtime
        uses: actions/cache@v5
        id: php-runtime-cache
        with:
          path: ${{ github.workspace }}/var/runtime
          key: ${{ runner.os }}-x86_64-pool-refresh-php-runtime-${{ hashFiles('sapi/PHP-VERSION.conf') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-pool-refresh-php-runtime-

      - name: Cache PHP Vendor
        uses: actions/cache@v5
        id: php-vendor-cache
        with:
          path: ${{ github.workspace }}/vendor
          key: ${{ runner.os }}-x86_64-pool-refresh-php-vendor-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-pool-refresh-php-vendor-

      - name: Cache Dependency Source Code Tarball
        uses: actions/cache/restore@v5
        id: pool-cache
        with:
          path: ${{ github.workspace }}/pool/
          key: source-code-tarball-pool

      - name: Clean Source Code Tarball Cache On Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run:
          rm -rf ${{ github.workspace }}/pool/*

      - name: Prepare Runtime and Libraries and Extensions
        run: |
          set -ex
          mkdir -p pool/lib
          mkdir -p pool/ext
          mkdir -p var/runtime/
          if [ ! -x var/runtime/php/php ] || [ ! -x var/runtime/php/composer ]; then
              bash  setup-php-runtime.sh
          fi

          WORK_DIR=${{ github.workspace }}
          export PATH=${WORK_DIR}/var/runtime/php/:$PATH
          alias php="php -d curl.cainfo=${WORK_DIR}/var/runtime/php/cacert.pem -d openssl.cafile=${WORK_DIR}/var/runtime/php/cacert.pem"

          composer install  --no-interaction --no-autoloader --no-scripts --profile
          composer dump-autoload --optimize --profile

          php prepare.php  +inotify +apcu +ds +ssh2  +uuid +protobuf +gettext --with-libavif=1 --show-tarball-hash=1
          php prepare.php           +apcu +ds +ssh2  +uuid +protobuf +gettext --with-libavif=1 --show-tarball-hash=1 @macos
          php sapi/scripts/download-php-src-archive.php

          echo 'cygwin: https://www.cygwin.com/COPYING' >> bin/LICENSE
          cd ${{ github.workspace }}/pool/
          zip -9 -r ${WORK_DIR}/all-deps.zip ext lib php-tar
          HASH=$(sha256sum ${WORK_DIR}/all-deps.zip | awk '{print $1}')
          echo " all-deps.zip sha265: ${HASH} "
          echo -n ${HASH} > ${WORK_DIR}/all-deps.zip.sha256sum
          cd ${{ github.workspace }}

      - name: Show Build Result
        run: |
          ls -A pool/lib/
          ls -A pool/ext/
          ls -A pool/php-tar/
          cat bin/LICENSE

      - name: Drop stale pool cache before refresh
        # restore/save 分开执行，避免精确命中后跳过保存。
        # 只删除当前 ref 的同名缓存，发版时保留默认分支和其他分支的缓存。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          cache_ids=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/caches" \
            -f key=source-code-tarball-pool -f ref="${CACHE_REF}" \
            --paginate --jq '.actions_caches[] | select(.key == "source-code-tarball-pool") | .id')
          for cache_id in ${cache_ids}; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
          done

      - name: Save refreshed dependency source archives
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/pool/
          key: ${{ steps.pool-cache.outputs.cache-primary-key }}

      - name: production artifacts
        uses: actions/upload-artifact@v5
        with:
          name: all-deps
          retention-days: 90
          path: |
            all-deps.zip
            all-deps.zip.sha256sum
            bin/LICENSE

      - name: gh release
        uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          files: |
            all-deps.zip
            all-deps.zip.sha256sum
            bin/LICENSE

      - name: upload artifacts to cloud object storage
        if: ${{ (github.repository == 'swoole/swoole-cli') && (startsWith(github.ref, 'refs/tags/'))  }}
        env:
          OSS_SECRET_ID: ${{ secrets.QCLOUD_OSS_SECRET_ID }}
          OSS_SECRET_KEY: ${{ secrets.QCLOUD_OSS_SECRET_KEY }}
          OSS_BUCKET: ${{ vars.QCLOUD_OSS_BUCKET }}
          OSS_REGION: ${{ vars.QCLOUD_OSS_REGION }}
        run: |
          bash sapi/scripts/tencent-cloud-object-storage.sh --upload-file ${{ github.workspace }}/all-deps.zip
          bash sapi/scripts/tencent-cloud-object-storage.sh --upload-file ${{ github.workspace }}/all-deps.zip.sha256sum
