name: build-php-runtime-iphoneos-arm64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iphoneos-arm64:
    if: ${{ !contains(github.event.head_commit.message, '--filter=') || contains(github.event.head_commit.message, '[iphoneos-arm64]') }}
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - name: Verify Xcode and iPhoneOS SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos clang \
            --target=arm64-apple-ios15.0 -arch arm64 -v -E -x c /dev/null \
            >/dev/null

      - name: Prepare host build environment
        run: |
          set -euo pipefail
          bash sapi/quickstart/macos/macos-init.sh
          git submodule update --init
          mkdir -p pool/lib pool/ext bin var/runtime var/iphoneos-arm64/deps

      - name: Cache PHP runtime
        uses: actions/cache@v5
        with:
          path: var/runtime
          key: ${{ runner.os }}-${{ runner.arch }}-php-runtime

      - name: Cache Composer vendor
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-${{ runner.arch }}-php-vendor

      - name: Cache dependency source archives
        uses: actions/cache@v5
        with:
          path: pool
          key: source-code-tarball-pool

      - name: Cache iPhoneOS target dependencies
        uses: actions/cache@v5
        with:
          path: var/iphoneos-arm64/deps
          key: iphoneos-arm64-deps-${{ hashFiles('sapi/PHP-VERSION.conf', 'sapi/src/builder/enabled_extensions_iphoneos.php', 'sapi/src/builder/library/gmp.php', 'sapi/src/builder/library/mpfr.php') }}

      - name: Prepare PHP build runtime and sources
        run: |
          set -euo pipefail
          if [[ ! -x var/runtime/php/php ]]; then
            bash setup-php-runtime.sh
          fi
          export PATH="${GITHUB_WORKSPACE}/var/runtime/php:${PATH}"
          bash sapi/download-box/download-box-get-archive-from-server.sh
          composer install --no-interaction --no-autoloader --no-scripts --profile
          composer dump-autoload --optimize --profile
          php prepare.php @iphoneos-arm64 --with-parallel-jobs=3

      - name: Build iPhoneOS PHP runtime layer
        id: runtime-layer
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/var/runtime/php:${PATH}"
          bash make.sh all-library
          bash make.sh config
          bash make.sh libphp
          GLOBAL_PREFIX="${GITHUB_WORKSPACE}/var/iphoneos-arm64/deps" \
            bash sapi/scripts/package-php-runtime-layer.sh iphoneos-arm64

      - name: Validate iPhoneOS runtime layer
        run: |
          set -euo pipefail
          archive=$(find runtime-layer -maxdepth 1 -name '*.tar.xz' -print -quit)
          test -n "${archive}"
          tar -tJf "${archive}" | grep -q '/lib/libphp.a$'
          package_root=${archive%.tar.xz}
          xcrun --sdk iphoneos lipo -archs "${package_root}/lib/libphp.a" \
            | grep -qw arm64
          test "$(sed -n 's/.*"target": "\([^"]*\)".*/\1/p' \
            "${package_root}/manifest.json")" = iphoneos-arm64

      - name: Upload iPhoneOS PHP runtime layer
        uses: actions/upload-artifact@v5
        with:
          name: php-runtime-layer-iphoneos-arm64
          retention-days: 14
          path: runtime-layer/*.tar.xz*
          if-no-files-found: error

  publish:
    name: Publish iPhoneOS Runtime Layer
    if: startsWith(github.ref, 'refs/tags/')
    needs: iphoneos-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: php-runtime-layer-iphoneos-arm64
          path: runtime-layer

      - name: Publish runtime layer release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runtime-layer/*.tar.xz
            runtime-layer/*.tar.xz.sha256
